[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ironmanfilter"
version = "0.1.0"
description = "Proximity-area noise filter: BFS flood-fill with a proximity window, thresholded by merged component area."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Sumit Kundu", email = "isumitkundu@hotmail.com" }]
keywords = ["image-processing", "noise-filter", "connected-components", "flood-fill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
py-modules = ["proximity_area_filter"]

[tool.pytest.ini_options]
testpaths = ["tests"]